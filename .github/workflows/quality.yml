name: Local platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Official v7 refs verified on 2026-10-06; pin code, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      # Authored dist is source: never run the retired frontend build.
      - name: Verify safe source export
        run: |
          node scripts/package-release.mjs "$RUNNER_TEMP/delta-source"
          node scripts/verify-release.mjs "$RUNNER_TEMP/delta-source"
